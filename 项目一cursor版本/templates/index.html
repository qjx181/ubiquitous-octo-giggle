<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多角色智能对话系统</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-2: #111827;
      --card: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --primary: #38bdf8;
      --primary-2: #60a5fa;
      --success: #34d399;
      --danger: #f87171;
      --shadow: 0 24px 80px rgba(15, 23, 42, 0.45);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 30%),
        radial-gradient(circle at top right, rgba(99, 102, 241, 0.16), transparent 24%),
        linear-gradient(180deg, #020617 0%, var(--bg) 100%);
      min-height: 100vh;
    }

    .shell {
      max-width: 1500px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .hero h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 0.5px;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--card-border);
      color: var(--text);
      backdrop-filter: blur(12px);
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .sidebar, .main {
      padding: 20px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 18px;
    }

    .muted { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .small { font-size: 12px; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(15, 23, 42, 0.72);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      outline: none;
      transition: border-color .2s, transform .2s, box-shadow .2s;
    }

    input:focus, textarea:focus {
      border-color: rgba(56,189,248,0.8);
      box-shadow: 0 0 0 4px rgba(56,189,248,0.12);
    }

    textarea { min-height: 120px; resize: vertical; }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; }

    button {
      border: 0;
      border-radius: 14px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 600;
      transition: transform .15s ease, opacity .15s ease, background .2s ease;
    }

    button:hover { transform: translateY(-1px); }
    button.primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #00111f; }
    button.secondary { background: rgba(255,255,255,0.1); color: var(--text); border: 1px solid rgba(255,255,255,0.1); }
    button.ghost { background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.14); }
    button.active { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #00111f; }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .status { margin-top: 8px; font-size: 13px; color: var(--success); }
    .danger { color: var(--danger); }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }

    .stack { display: grid; gap: 12px; }

    .sessions {
      display: grid;
      gap: 8px;
      max-height: 240px;
      overflow: auto;
      padding-right: 4px;
    }

    .session-item {
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(15,23,42,0.55);
      border: 1px solid rgba(255,255,255,0.08);
      word-break: break-all;
    }

    .session-item a { color: #bae6fd; text-decoration: none; }
    .session-item a:hover { text-decoration: underline; }

    .chat {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
      min-height: 78vh;
    }

    .messages {
      overflow: auto;
      padding-right: 6px;
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .msg {
      padding: 14px 16px;
      border-radius: 18px;
      line-height: 1.8;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .msg.user {
      background: linear-gradient(135deg, rgba(56,189,248,0.25), rgba(96,165,250,0.18));
      margin-left: 10%;
    }

    .msg.assistant {
      background: rgba(15,23,42,0.68);
      margin-right: 10%;
    }

    .source {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 12px;
      color: var(--muted);
    }

    .source details {
      margin-top: 10px;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .source summary {
      cursor: pointer;
      list-style: none;
      padding: 10px 12px;
      color: var(--text);
      font-weight: 600;
      user-select: none;
    }

    .source summary::-webkit-details-marker { display: none; }

    .source-body {
      padding: 0 12px 12px;
      display: grid;
      gap: 8px;
    }

    .source-item {
      margin-top: 0;
      padding-top: 10px;
      border-top: 1px dashed rgba(255,255,255,0.12);
    }

    .source-link {
      color: #93c5fd;
      text-decoration: none;
      word-break: break-all;
    }

    .source-link:hover { text-decoration: underline; }

    .source-web .msg.assistant {
      border-left: 4px solid #38bdf8;
    }

    .source-local .msg.assistant {
      border-left: 4px solid #34d399;
    }

    .composer {
      display: grid;
      gap: 12px;
      padding: 16px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(15,23,42,0.55);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 60;
    }

    .modal-backdrop.show { display: flex; }

    .modal {
      width: min(520px, 100%);
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: var(--shadow);
      padding: 20px;
      transform: translateY(10px) scale(0.98);
      opacity: 0;
      transition: transform .2s ease, opacity .2s ease;
    }

    .modal-backdrop.show .modal {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 20px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    code {
      padding: 2px 6px;
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      color: #e2e8f0;
    }

    @media (max-width: 1080px) {
      .layout { grid-template-columns: 1fr; }
      .msg.user, .msg.assistant { margin-left: 0; margin-right: 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <div>
        <h1>多角色智能对话系统</h1>
        <p>支持登录、会话管理、角色切换、RAG 检索、联网兜底与流式回复。</p>
      </div>
      <div class="badge">
        <span>服务地址</span>
        <code id="apiBaseText"></code>
      </div>
    </div>

    <div class="layout">
      <aside class="card sidebar">
        <div class="stack">
          <div>
            <div class="section-title">
              <h2>登录与账号</h2>
              <span class="pill" id="healthStatus">检查后端中...</span>
            </div>
            <div class="actions">
              <button class="primary" onclick="openAuthModal('login')">登录</button>
              <button class="secondary" onclick="openAuthModal('register')">注册</button>
              <button class="ghost" onclick="logout()">退出</button>
            </div>
            <div id="authMsg" class="status"></div>
            <div class="muted" style="margin-top: 8px;">当前用户：<span id="currentUser">未登录</span></div>
          </div>

          <div>
            <div class="section-title">
              <h2>角色与风格</h2>
              <span class="pill" id="rolePill">律师</span>
            </div>
            <div class="chips">
              <button id="role-law" class="active" onclick="selectRole('律师')">律师</button>
              <button id="role-doc" class="secondary" onclick="selectRole('医生')">医生</button>
            </div>
            <div class="chips" style="margin-top: 10px;">
              <button class="secondary" onclick="selectStyle('严谨专业')">严谨专业</button>
              <button class="secondary" onclick="selectStyle('温和耐心')">温和耐心</button>
              <button class="secondary" onclick="selectStyle('简洁干练')">简洁干练</button>
              <button class="secondary" onclick="selectStyle('亲切易懂')">亲切易懂</button>
            </div>
            <div class="muted" style="margin-top: 8px;">当前风格：<span id="stylePill">严谨专业</span></div>
          </div>

          <div>
            <div class="section-title">
              <h2>会话管理</h2>
              <span class="pill">会话</span>
            </div>
            <div class="actions">
              <button class="primary" style="width: 100%;" onclick="createSession()">新建会话</button>
            </div>
            <div class="muted" style="margin-top: 8px;">当前会话：<span id="sessionId">未创建</span></div>
            <div style="height: 12px;"></div>
            <div class="muted">会话列表</div>
            <div id="sessions" class="sessions" style="margin-top: 8px;">暂无</div>
          </div>
        </div>
      </aside>

      <main class="card main chat">
        <div class="toolbar">
          <div>
            <div class="section-title" style="margin-bottom: 8px;">
              <h2>对话区</h2>
              <span class="pill" id="backendPill">本地后端</span>
            </div>
            <div class="muted" id="subtitle">结论优先、来源可展开、支持流式输出。</div>
          </div>
          <div class="meta">
            <span class="pill">Enter 发送</span>
            <span class="pill">Shift+Enter 换行</span>
          </div>
        </div>

        <div id="messages" class="messages">
          <div class="msg assistant">
            你好，我已经准备好了。请先登录并创建会话，然后开始提问。
          </div>
        </div>

        <div class="composer">
          <textarea id="query" placeholder="请输入你的问题，例如：如何给这起医疗纠纷进行初步分析？"></textarea>
          <div class="actions">
            <button class="primary" onclick="sendMessage()">发送消息</button>
            <button class="secondary" onclick="clearMessages()">清空对话</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="authModal" class="modal-backdrop" onclick="closeAuthModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head">
        <div>
          <h3 id="authModalTitle">登录账号</h3>
          <div class="muted" id="authModalDesc">请输入你的账号和密码登录系统。</div>
        </div>
        <button class="ghost" onclick="hideAuthModal()">关闭</button>
      </div>
      <div class="stack">
        <div class="grid-2">
          <input id="modalUsername" placeholder="用户名" />
          <input id="modalPassword" type="password" placeholder="密码" />
        </div>
        <div class="modal-actions">
          <button class="primary" id="authSubmitBtn" onclick="submitAuth()">登录</button>
          <button class="secondary" onclick="fillDemoAccount()">填充示例</button>
          <button class="secondary" onclick="togglePasswordVisibility()">显示/隐藏密码</button>
          <button class="ghost" onclick="hideAuthModal()">取消</button>
        </div>
        <div id="modalAuthMsg" class="status"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    document.getElementById('apiBaseText').textContent = API_BASE;

    let token = localStorage.getItem('access_token') || '';
    let role = localStorage.getItem('current_role') || '律师';
    let style = localStorage.getItem('current_style') || '严谨专业';
    let sessionId = localStorage.getItem('session_id') || '';
    let username = localStorage.getItem('auth_username') || '';
    let currentAbort = null;

    const queryEl = document.getElementById('query');
    queryEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function setRoleUI() {
      document.getElementById('rolePill').textContent = role;
      document.getElementById('stylePill').textContent = style;
      document.getElementById('role-law').className = role === '律师' ? 'active' : 'secondary';
      document.getElementById('role-doc').className = role === '医生' ? 'active' : 'secondary';
    }

    function selectRole(r) {
      role = r;
      localStorage.setItem('current_role', role);
      setRoleUI();
    }

    function selectStyle(s) {
      style = s;
      localStorage.setItem('current_style', style);
      setRoleUI();
    }

    let authMode = 'login';

    function openAuthModal(mode) {
      authMode = mode;
      document.getElementById('authModalTitle').textContent = mode === 'login' ? '登录账号' : '注册账号';
      document.getElementById('authModalDesc').textContent = mode === 'login' ? '请输入你的账号和密码登录系统。' : '创建一个新账号开始使用系统。';
      document.getElementById('authSubmitBtn').textContent = mode === 'login' ? '登录' : '注册';
      document.getElementById('modalAuthMsg').textContent = '';
      document.getElementById('authModal').classList.add('show');
      document.getElementById('modalUsername').value = '';
      document.getElementById('modalPassword').value = '';
      if (username) document.getElementById('modalUsername').value = username;
      setTimeout(() => document.getElementById('modalUsername').focus(), 0);
    }

    function hideAuthModal() {
      document.getElementById('authModal').classList.remove('show');
    }

    function closeAuthModal(event) {
      if (event.target.id === 'authModal') hideAuthModal();
    }

    function fillDemoAccount() {
      document.getElementById('modalUsername').value = 'demo';
      document.getElementById('modalPassword').value = '123456';
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('modalPassword');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    async function submitAuth() {
      const u = document.getElementById('modalUsername').value.trim();
      const p = document.getElementById('modalPassword').value.trim();
      const msg = document.getElementById('modalAuthMsg');
      if (!u || !p) {
        msg.textContent = '请输入用户名和密码';
        msg.className = 'status danger';
        return;
      }
      const endpoint = authMode === 'login' ? '/auth/login' : '/auth/register';
      const res = await fetch(API_BASE + endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        msg.textContent = data.detail || data.message || '认证失败';
        msg.className = 'status danger';
        return;
      }
      token = data.token;
      username = data.username || u;
      localStorage.setItem('access_token', token);
      localStorage.setItem('auth_username', username);
      localStorage.setItem('user_id', username);
      document.getElementById('currentUser').textContent = username;
      document.getElementById('authMsg').textContent = authMode === 'login' ? '登录成功' : '注册成功';
      document.getElementById('authMsg').className = 'status';
      msg.textContent = authMode === 'login' ? '登录成功' : '注册成功';
      msg.className = 'status';
      hideAuthModal();
      loadSessions();
      checkHealth();
    }

    async function auth(mode) {
      openAuthModal(mode);
    }

    function logout() {
      token = '';
      sessionId = '';
      localStorage.removeItem('access_token');
      localStorage.removeItem('session_id');
      document.getElementById('currentUser').textContent = '未登录';
      document.getElementById('sessionId').textContent = '未创建';
      document.getElementById('sessions').innerHTML = '暂无';
      document.getElementById('authMsg').textContent = '已退出登录';
      addAssistant('已退出登录');
    }

    async function createSession() {
      if (!token) return alert('请先登录');
      const res = await fetch(API_BASE + '/session/create', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ role, style })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) return alert(data.detail || '创建会话失败');
      sessionId = data.session_id;
      localStorage.setItem('session_id', sessionId);
      document.getElementById('sessionId').textContent = sessionId;
      addAssistant(`会话已创建：${sessionId}`);
      loadSessions();
    }

    async function loadSessions() {
      if (!token) return;
      const res = await fetch(API_BASE + '/sessions', { headers: { 'Authorization': `Bearer ${token}` } });
      const data = await res.json().catch(() => ({ sessions: [] }));
      const box = document.getElementById('sessions');
      if (!data.sessions || !data.sessions.length) {
        box.innerHTML = '暂无';
        return;
      }
      box.innerHTML = data.sessions.map(s => `<div class="session-item"><a href="#" onclick="switchSession('${s}');return false;">${escapeHtml(s)}</a></div>`).join('');
    }

    function switchSession(s) {
      sessionId = s;
      localStorage.setItem('session_id', s);
      document.getElementById('sessionId').textContent = s;
      addAssistant('已切换会话：' + s);
    }

    function clearMessages() {
      document.getElementById('messages').innerHTML = '';
    }

    function addUser(text) {
      const el = document.createElement('div');
      el.className = 'msg user';
      el.textContent = text;
      document.getElementById('messages').appendChild(el);
      scrollBottom();
    }

    function addAssistant(text) {
      const el = document.createElement('div');
      el.className = 'msg assistant';
      el.textContent = text;
      document.getElementById('messages').appendChild(el);
      scrollBottom();
    }

    function renderRefs(refs) {
      return '';
    }

    function scrollBottom() {
      const box = document.getElementById('messages');
      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
      const q = queryEl.value.trim();
      if (!token) return alert('请先登录');
      if (!sessionId) return alert('请先创建会话');
      if (!q) return;
      addUser(q);
      queryEl.value = '';
      if (currentAbort) currentAbort.abort();
      currentAbort = new AbortController();
      const loading = document.createElement('div');
      loading.className = 'msg assistant';
      loading.textContent = '正在生成...';
      document.getElementById('messages').appendChild(loading);
      scrollBottom();
      let answer = '';
      let refs = [];
      try {
        const res = await fetch(API_BASE + '/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ session_id: sessionId, query: q, role, style, stream: true }),
          signal: currentAbort.signal
        });
        if (!res.ok || !res.body) throw new Error(await res.text());
        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buf = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split('\n\n');
          buf = parts.pop() || '';
          for (const part of parts) {
            const lines = part.split('\n');
            let event = 'message';
            let dataLine = '';
            for (const line of lines) {
              if (line.startsWith('event: ')) event = line.slice(7).trim();
              if (line.startsWith('data: ')) dataLine += line.slice(6).trim();
            }
            if (!dataLine) continue;
            const payload = JSON.parse(dataLine);
            if (event === 'meta') {
              refs = payload.references || [];
              continue;
            }
            if (event === 'done') {
              answer = payload.answer || answer;
              continue;
            }
            if (event === 'error') throw new Error(payload.detail || '生成失败');
            if (payload.chunk) {
              answer += payload.chunk;
              loading.innerHTML = `<div>${escapeHtml(answer).replace(/\n/g, '<br>')}</div>`;
            }
          }
        }
        loading.className = 'msg assistant';
        loading.innerHTML = `<div>${escapeHtml(answer || '不足以判断').replace(/\n/g, '<br>')}</div>`;
      } catch (e) {
        loading.textContent = '出错：' + (e.message || '请求失败');
      } finally {
        currentAbort = null;
      }
      scrollBottom();
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function checkHealth() {
      try {
        const res = await fetch(API_BASE + '/health');
        const data = await res.json();
        document.getElementById('healthStatus').textContent = data.message || '服务运行正常';
      } catch {
        document.getElementById('healthStatus').textContent = '后端未连接';
      }
    }

    document.getElementById('currentUser').textContent = username || '未登录';
    if (sessionId) document.getElementById('sessionId').textContent = sessionId;
    setRoleUI();
    checkHealth();
    if (token) loadSessions();
  </script>
</body>
</html>
